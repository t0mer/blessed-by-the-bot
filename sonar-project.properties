sonar.projectKey=t0mer_blessed-by-the-bot
sonar.projectName=blessed-by-the-bot

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=web/node_modules/**,internal/webui/dist/**,assets/**,docs/**,**/*_test.go

# Coverage comes from the profile the workflow generates; without this Sonar
# reports 0% and the quality gate fails for the wrong reason.
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node 22: Vite 8 requires ^20.19 || >=22.12, and 22 is the current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend must exist before anything compiles: internal/webui embeds
      # it, and the tracked placeholder alone would ship a "UI not built" page.
      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest  # v8 requires golangci-lint v2, matching .golangci.yml's `version: "2"`

      - name: Test with race detector
        env:
          # The race detector needs cgo; every shipped artifact is still built
          # with CGO_ENABLED=0, and the cgo-free test run below keeps that honest.
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Test without cgo
        env:
          CGO_ENABLED: 0
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Deliberately built without the frontend: this proves `go:embed all:dist`
      # still compiles from the tracked placeholder alone, so a contributor who
      # has never run npm can build the binary.
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/blessedbot

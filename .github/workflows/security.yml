name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dependency CVE appears without anyone touching the code, so a
  # commit-triggered scan alone would miss it. Weekly catches that.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulns:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Reads the toolchain line in go.mod, which is pinned to a patched
          # release — the stdlib is the largest source of findings here.
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit, not just the tip

      # The binary rather than the action: gitleaks-action requires a licence
      # key for organisation repos, and this needs none.
      - name: gitleaks
        env:
          VERSION: "8.30.1"
          # Checksum from the release's published checksums.txt. Piping an
          # unverified download straight into tar would make this scanner its
          # own supply-chain hole.
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict
          tar -xzf "$TARBALL" -C /usr/local/bin gitleaks
          gitleaks detect --log-opts="--all" --redact --no-banner --verbose

  dependencies:
    name: Dependencies and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — dependencies and secrets
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1" # gate the merge
          skip-dirs: web/node_modules,internal/webui/dist

      - name: Trivy — Dockerfile and compose misconfiguration
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build locally rather than pulling a published tag, so a vulnerability is
      # caught before it is ever pushed to a registry.
      - name: Build image
        run: docker build --build-arg VERSION=ci -t blessedbot:ci .

      - name: Trivy — image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: image
          image-ref: blessedbot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit
        run: cd web && npm ci && npm audit --audit-level=high

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actionlint catches expression-injection patterns and bad runner labels
      # in the workflows themselves.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    # Secrets are not available in a job-level `if`, so the guard is on the
    # steps: without SNYK_TOKEN configured the job is a no-op rather than a
    # permanent red X on every PR.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Report when unconfigured
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN is not set; skipping. Add the secret to enable this gate."

      - uses: actions/setup-go@v5
        if: env.SNYK_TOKEN != ''
        with:
          go-version-file: go.mod
          cache: true

      - # Pinned to a commit: @master would let an upstream change run in a
        # job that holds SNYK_TOKEN.
        uses: snyk/actions/golang@12140f4059e244892ae643824a95459a102120dd # master @ 2026-08
        if: env.SNYK_TOKEN != ''
        with:
          args: --severity-threshold=high --all-projects

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs history for new-code detection

      - name: Report when unconfigured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; skipping. Add SONAR_TOKEN (and SONAR_HOST_URL for self-hosted) to enable this gate."

      - uses: actions/setup-go@v5
        if: env.SONAR_TOKEN != ''
        with:
          go-version-file: go.mod
          cache: true

      # Sonar reads coverage from this report; without it the quality gate
      # judges coverage as zero and fails for the wrong reason.
      - name: Test with coverage
        if: env.SONAR_TOKEN != ''
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        if: env.SONAR_TOKEN != ''
